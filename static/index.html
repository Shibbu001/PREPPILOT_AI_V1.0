<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrepPilot AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 38px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 22px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="file"] {
            margin-bottom: 22px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            margin-top: 18px;
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            color: #6b7280;
        }

        #result {
            display: none;
        }

        .score-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 28px;
        }

        .score-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #2563eb;
        }

        .section {
            margin-top: 28px;
        }

        .section h3 {
            margin-bottom: 14px;
            font-size: 20px;
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            padding: 8px 13px;
            border-radius: 20px;
            background: #eef2ff;
            color: #3730a3;
            font-size: 14px;
        }

        .skill.missing {
            background: #fff7ed;
            color: #c2410c;
        }

        .project {
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .project-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .project-text {
            color: #4b5563;
            line-height: 1.5;
        }

        .interview-question {
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 15px 18px;
            margin-bottom: 10px;
            border-radius: 6px;
            line-height: 1.5;
        }

        .recommendation {
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 6px;
            line-height: 1.5;
        }

        .evidence {
            margin-top: 8px;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.5;
        }

        .strength {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 9px;
            border-radius: 12px;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 12px;
        }

        .priority {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 9px;
            border-radius: 12px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 12px;
        }

        .meta {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 13px;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 15px;
            border-radius: 8px;
        }

        .summary {
            background: #f8fafc;
            padding: 18px;
            border-radius: 8px;
            line-height: 1.6;
            color: #374151;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>PrepPilot AI</h1>
        <p>AI-powered resume and job description analyzer</p>
    </div>


    <!-- ================= INPUT ================= -->

    <div class="card">

        <form id="form">

            <label for="resume">
                Resume PDF
            </label>

            <input
                type="file"
                id="resume"
                accept=".pdf"
                required
            >


            <label for="jd">
                Job Description
            </label>

            <textarea
                id="jd"
                placeholder="Paste the job description here..."
                required
            ></textarea>


            <button id="analyzeBtn" type="submit">
                Analyze Resume
            </button>

            <div id="status"></div>

        </form>

    </div>


    <!-- ================= RESULT ================= -->

    <div class="card" id="result">

        <h2>Analysis Result</h2>


        <!-- SCORE -->

        <div class="score-card">

            <div class="score-label">
                Resume Match Score
            </div>

            <div id="score" class="score">
                --
            </div>

        </div>


        <!-- SUMMARY -->

        <div
            id="summarySection"
            class="section"
            style="display:none;"
        >

            <h3>Summary</h3>

            <div
                id="summary"
                class="summary"
            ></div>

        </div>


        <!-- MATCHING SKILLS -->

        <div class="section">

            <h3>Matching Skills</h3>

            <div
                id="matchingSkills"
                class="skill-list"
            ></div>

        </div>


        <!-- MISSING SKILLS -->

        <div class="section">

            <h3>Missing / Weak Skills</h3>

            <div
                id="missingSkills"
                class="skill-list"
            ></div>

        </div>


        <!-- PROJECT RELEVANCE -->

        <div class="section">

            <h3>Project Relevance</h3>

            <div id="projectRelevance"></div>

        </div>


        <!-- INTERVIEW -->

        <div class="section">

            <h3>Interview Focus</h3>

            <div id="interviewFocus"></div>

        </div>


        <!-- RECOMMENDATIONS -->

        <div
            id="recommendationSection"
            class="section"
            style="display:none;"
        >

            <h3>Recommendations</h3>

            <div id="recommendations"></div>

        </div>


        <!-- META -->

        <div id="meta" class="meta"></div>

    </div>

</div>


<script>

const form = document.getElementById("form");

const button = document.getElementById("analyzeBtn");

const status = document.getElementById("status");

const resultBox = document.getElementById("result");

const scoreBox = document.getElementById("score");

const summarySection =
    document.getElementById("summarySection");

const summaryBox =
    document.getElementById("summary");

const matchingSkillsBox =
    document.getElementById("matchingSkills");

const missingSkillsBox =
    document.getElementById("missingSkills");

const projectBox =
    document.getElementById("projectRelevance");

const interviewBox =
    document.getElementById("interviewFocus");

const recommendationSection =
    document.getElementById("recommendationSection");

const recommendationBox =
    document.getElementById("recommendations");

const metaBox =
    document.getElementById("meta");



form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const resume =
        document.getElementById("resume").files[0];

    const jd =
        document.getElementById("jd").value;


    if (!resume) {

        status.textContent =
            "Please upload a PDF resume.";

        return;
    }


    const data = new FormData();

    data.append("resume", resume);

    data.append(
        "job_description",
        jd
    );


    button.disabled = true;

    button.textContent = "Analyzing...";

    status.textContent =
        "Extracting resume → retrieving relevant sections → generating AI analysis...";


    resultBox.style.display = "none";


    try {

        const response = await fetch(
            "/analyze",
            {
                method: "POST",
                body: data
            }
        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                result.error ||
                "Analysis failed."
            );

        }


        /*
         * ========================================
         * REPORT
         * ========================================
         */

        const report = result.report;


        /*
         * ========================================
         * SCORE
         * ========================================
         */

        if (
            report &&
            typeof report.match_score === "number"
        ) {

            scoreBox.textContent =
                report.match_score + "/100";

        } else {

            scoreBox.textContent =
                "--";

        }


        /*
         * ========================================
         * SUMMARY
         * ========================================
         */

        if (report && report.summary) {

            summarySection.style.display =
                "block";

            summaryBox.textContent =
                report.summary;

        } else {

            summarySection.style.display =
                "none";

        }


        /*
         * ========================================
         * MATCHING SKILLS
         * ========================================
         */

        matchingSkillsBox.innerHTML = "";


        if (
            report &&
            Array.isArray(report.matching_skills)
        ) {

            report.matching_skills.forEach(item => {

                const skill =
                    document.createElement("div");

                skill.className =
                    "skill";


                /*
                 * New structured format
                 */

                if (
                    typeof item === "object" &&
                    item !== null
                ) {

                    skill.textContent =
                        item.skill || "Skill";

                    if (item.evidence) {

                        skill.title =
                            item.evidence;

                    }

                } else {

                    /*
                     * Backward compatibility
                     */

                    skill.textContent =
                        String(item);

                }


                matchingSkillsBox.appendChild(
                    skill
                );

            });

        }



        /*
         * ========================================
         * MISSING / WEAK SKILLS
         * ========================================
         */

        missingSkillsBox.innerHTML = "";


        if (
            report &&
            Array.isArray(report.missing_skills)
        ) {

            report.missing_skills.forEach(item => {

                const skill =
                    document.createElement("div");

                skill.className =
                    "skill missing";


                if (
                    typeof item === "object" &&
                    item !== null
                ) {

                    skill.textContent =
                        item.skill || "Missing skill";

                    if (item.reason) {

                        skill.title =
                            item.reason;

                    }

                } else {

                    skill.textContent =
                        String(item);

                }


                missingSkillsBox.appendChild(
                    skill
                );

            });

        }



        /*
         * ========================================
         * PROJECT RELEVANCE
         * ========================================
         */

        projectBox.innerHTML = "";


        if (
            report &&
            Array.isArray(report.project_relevance)
        ) {

            report.project_relevance.forEach(item => {

                const project =
                    document.createElement("div");

                project.className =
                    "project";


                if (
                    typeof item === "object" &&
                    item !== null
                ) {

                    const title =
                        document.createElement("div");

                    title.className =
                        "project-title";

                    title.textContent =
                        item.project ||
                        "Project";


                    const text =
                        document.createElement("div");

                    text.className =
                        "project-text";

                    text.textContent =
                        item.relevance ||
                        "";


                    if (
                        item.score !== undefined
                    ) {

                        text.textContent +=
                            "  Relevance Score: " +
                            item.score +
                            "/10";

                    }


                    project.appendChild(
                        title
                    );

                    project.appendChild(
                        text
                    );

                } else {

                    project.textContent =
                        String(item);

                }


                projectBox.appendChild(
                    project
                );

            });

        }



        /*
         * ========================================
         * INTERVIEW QUESTIONS
         * ========================================
         */

        interviewBox.innerHTML = "";


        if (
            report &&
            Array.isArray(report.interview_focus)
        ) {

            report.interview_focus.forEach(
                (question, index) => {

                    const box =
                        document.createElement("div");

                    box.className =
                        "interview-question";

                    box.textContent =
                        (index + 1) +
                        ". " +
                        String(question);


                    interviewBox.appendChild(
                        box
                    );

                }
            );

        }



        /*
         * ========================================
         * RECOMMENDATIONS
         * ========================================
         */

        recommendationBox.innerHTML = "";


        if (
            report &&
            Array.isArray(report.recommendations) &&
            report.recommendations.length > 0
        ) {

            recommendationSection.style.display =
                "block";


            report.recommendations.forEach(
                recommendation => {

                    const box =
                        document.createElement("div");

                    box.className =
                        "recommendation";

                    box.textContent =
                        String(recommendation);


                    recommendationBox.appendChild(
                        box
                    );

                }
            );

        } else {

            recommendationSection.style.display =
                "none";

        }



        /*
         * ========================================
         * META
         * ========================================
         */

        metaBox.textContent =
            "Resume: " +
            (result.filename || "Unknown") +
            " | Retrieved chunks: " +
            (result.retrieved_chunks?.length || 0) +
            " | Total resume chunks: " +
            (result.chunk_count || 0);


        /*
         * ========================================
         * SHOW RESULT
         * ========================================
         */

        resultBox.style.display =
            "block";


        status.textContent =
            "Analysis completed successfully.";


        /*
         * Scroll to result
         */

        resultBox.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });


    } catch (error) {

        resultBox.style.display =
            "block";


        scoreBox.textContent = "";


        summarySection.style.display =
            "none";


        matchingSkillsBox.innerHTML =
            "";

        missingSkillsBox.innerHTML =
            "";

        projectBox.innerHTML =
            "";

        interviewBox.innerHTML =
            "";


        recommendationSection.style.display =
            "none";


        metaBox.innerHTML =
            '<div class="error">' +
            error.message +
            '</div>';


        status.textContent = "";

    } finally {

        button.disabled = false;

        button.textContent =
            "Analyze Resume";

    }

});

</script>

</body>
</html>
